<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML programs 31 to 40</title>
</head>
<body>
<h2>Step 1 - Email</h2>
<form>
<label>Email:</label><br>
<input type="email" required><br>
<label>Password:</label><br>
<input type="password" minlength="8" required><br>
<label>Full Name:</label><br>
<input type="text" required><br>
<label>Phone:</label><br>
<input type="number" required><br>
<input type="submit" value="Register">
</form><hr>
<h2>Login Form</h2>
<form>
<label>Email</label><br>
<input type="email" required><br>
<label>Password</label><br>
<input type="password" minlength="8" required><br>
<input type="submit" value="Login">
</form><hr>
<h2>Subscription Form</h2>
<form>
<label>Email</label><br>
<input type="email" placeholder="Enter Email" required><br>
<label>Gender</label><br>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<br>
<label>Favorite Color</label><br>
<input type="color"><br>
<input type="submit" value="Subscribe">
</form><hr>
<h2>Range Slider</h2>
<form>
<input type="range" min="10" max="100"><br>
<hr>
<h2>color selector</h2>
<label>Select your color:</label>
<input type="color"><br><hr>
<h2>Select date</h2>
<label>Date:</label>
<input type="date" required><br>
<button type="submit">Submit</button><hr>
<h2>Search Course</h2>
<label>Choose Course:</label><br>
<input list="courses">
<datalist id="courses">
    <option value="HTML">
    <option value="CSS">
    <option value="JavaScript">
    <option value="Python">
    <option value="ReactJS">
</datalist><hr>
<H2>Group Form </H2>
<fieldset>
    <legend>Shipping Address</legend>
<label>Name</label><br>
<input type="text" required><br>
<label>Address</label><br>
<textarea rows="4" cols="30" required></textarea><br>
<label>City</label><br>
<input type="text" required><br>
<label>Pincode</label><br>
<input type="text" required pattern="[0-9]{6}"><br>
<input type="submit">
</fieldset><hr>
<h2>Feedback form</h2>
<label>Enter your feedback</label>
<textarea rows="5" cols="50" required></textarea><br>
<input type="checkbox" required>I AGREE<br>
<button type="submit">Submit</button><br><hr>
<h2>Donation form</h2>
<label>Name</label>
<input type="name" required>
<label>Amount:</label>
<input type="number" required><br>
<button type="submit">submit</button>
</form>
</body>
</html>
