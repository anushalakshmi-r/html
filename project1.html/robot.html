<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        /* =========================
   AI ROBOT ANIMATION
========================= */

.ai-robot-container {
    position: relative;
    width: 500px;
    height: 500px;
    margin: auto;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* Glow behind robot */

.robot-glow {
    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: #00e5ff;

    filter: blur(120px);

    opacity: 0.35;

    animation: glowPulse 3s ease-in-out infinite;
}


/* Robot */

.ai-robot {
    width: 230px;
    height: 230px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    z-index: 2;

    background: rgba(255, 255, 255, 0.08);

    border: 2px solid #00e5ff;

    backdrop-filter: blur(10px);

    box-shadow:
        0 0 20px #00e5ff,
        0 0 50px rgba(0, 229, 255, 0.5);

    animation: robotFloat 4s ease-in-out infinite;
}


/* Robot Icon */

.ai-robot i {
    font-size: 120px;
    color: #00e5ff;

    animation: robotPulse 2s ease-in-out infinite;
}


/* Floating icons */

.floating-icon {
    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(255, 255, 255, 0.08);

    border: 1px solid #00e5ff;

    backdrop-filter: blur(10px);

    box-shadow: 0 0 20px #00e5ff;

    z-index: 3;
}


.floating-icon i {
    font-size: 28px;
    color: #00e5ff;
}


/* Icon Positions */

.icon1 {
    top: 40px;
    left: 60px;

    animation: float1 4s ease-in-out infinite;
}


.icon2 {
    top: 80px;
    right: 50px;

    animation: float2 5s ease-in-out infinite;
}


.icon3 {
    bottom: 60px;
    left: 50%;

    transform: translateX(-50%);

    animation: float3 4s ease-in-out infinite;
}


/* AI Label */

.ai-label {
    position: absolute;

    bottom: 5px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    letter-spacing: 4px;

    font-size: 14px;

    padding: 10px 20px;

    border: 1px solid #00e5ff;

    border-radius: 30px;

    background: rgba(0, 229, 255, 0.1);
}


.ai-label span {
    color: #00e5ff;
    font-weight: bold;
}


/* =========================
   ANIMATIONS
========================= */


/* Robot floating */

@keyframes robotFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }

}


/* Robot glow pulse */

@keyframes robotPulse {

    0%,
    100% {
        transform: scale(1);
        filter: drop-shadow(0 0 5px #00e5ff);
    }

    50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 25px #00e5ff);
    }

}


/* Background glow */

@keyframes glowPulse {

    0%,
    100% {
        transform: scale(0.8);
        opacity: 0.3;
    }

    50% {
        transform: scale(1.2);
        opacity: 0.6;
    }

}


/* Floating Icon 1 */

@keyframes float1 {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-20px);
    }

}


/* Floating Icon 2 */

@keyframes float2 {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(25px);
    }

}


/* Floating Icon 3 */

@keyframes float3 {

    0%,
    100% {
        transform: translateX(-50%) translateY(0);
    }

    50% {
        transform: translateX(-50%) translateY(-20px);
    }

}
    </style>
</head>
<body>
    <div class="col-lg-6 text-center">

    <div class="ai-robot-container">

        <!-- Glow Background -->
        <div class="robot-glow"></div>

        <!-- Floating Robot -->
        <div class="ai-robot">

            <i class="bi bi-robot"></i>

        </div>

        <!-- Floating Elements -->
        <div class="floating-icon icon1">
            <i class="bi bi-cpu"></i>
        </div>

        <div class="floating-icon icon2">
            <i class="bi bi-code-slash"></i>
        </div>

        <div class="floating-icon icon3">
            <i class="bi bi-stars"></i>
        </div>

        <!-- AI Text -->
        <div class="ai-label">
            <span>AI</span>
            SYSTEM
        </div>

    </div>

</div>
</body>
</html>
