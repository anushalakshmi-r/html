    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

            <!-- Logo and Student Name -->
            <div class="flex items-center gap-3">
                <div class="bg-white text-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl">
                    A
                </div>

                <h1 class="text-lg md:text-xl lg:text-2xl font-bold">
                    Anusha Lakshmi
                </h1>
            </div>

            <!-- Navigation Links -->
            <div class="hidden md:flex gap-6 text-sm lg:text-base">
                <a href="#" class="hover:text-blue-200">Home</a>
                <a href="#" class="hover:text-blue-200">Profile</a>
                <a href="#" class="hover:text-blue-200">Courses</a>
                <a href="#" class="hover:text-blue-200">Contact</a>
            </div>

        </div>
    </nav>

    <!-- Main Section -->
    <main class="min-h-screen flex items-center justify-center p-4 md:p-8 lg:p-12">

        <!-- Profile Card -->
        <div class="bg-white border rounded-2xl shadow-xl p-6 md:p-8 lg:p-10 
                    w-full max-w-md md:max-w-2xl">

            <div class="flex flex-col md:flex-row items-center gap-6">

                <!-- Profile Photo -->
                <img 
                    src="../images/girl.avif"
                    alt="Student Profile"
                    class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover shadow-md">

                <!-- Student Details -->
                <div class="text-center md:text-left">

                    <h2 class="text-2xl md:text-3xl lg:text-4xl 
                               font-bold text-gray-800 mb-2">
                        Anusha Lakshmi
                    </h2>

                    <p class="text-blue-600 font-semibold text-lg mb-3">
                        AI Python Full Stack Developer
                    </p>

                    <p class="text-gray-600 text-sm md:text-base leading-relaxed">
                        Passionate Computer Science graduate currently learning
                        AI, Python Full Stack Development, HTML, CSS, Bootstrap,
                        Tailwind CSS and modern web technologies.
                    </p>

                    <!-- Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 mt-6">

                        <button class="bg-blue-600 text-white px-5 py-2 
                                       rounded-lg shadow-md hover:bg-blue-700 
                                       transition">
                            Edit Profile
                        </button>

                        <button class="border border-blue-600 text-blue-600 
                                       px-5 py-2 rounded-lg shadow-sm 
                                       hover:bg-blue-50 transition">
                            Contact
                        </button>

                    </div>

                </div>
            </div>

        </div>

    </main>

</body>
</html>
</body>
</html>
