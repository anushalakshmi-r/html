<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
</head>
<body>
    
        
    <h2>ADMISSION FORM</h2>
        <form>
        <h1>Registration form</h1>
        <label for="name">Name</label>
        <input type="text" id="name" name="name"><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email"><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password"><br>
        <label for="phone">Phone Number</label>
        <input type="number" id="phone" pattern="[0-9]{10}" maxlength="10" required><br>
        <label for="gender">Gender</label><br>
        <input type="radio" id="gender" name="gender" value="male">Male<br>
        <input type="radio" id="gender" name="gender" value="female">Female<br>
        <label for="skills">Skills</label><br>
        <input type="checkbox" id="skills" name="skills">HTML<br>
        <input type="checkbox" id="skills" name="skills">CSS<br>
        <input type="checkbox" id="skills" name="skills">JAVASCRIPT<br>
        <input type="checkbox" id="skills" name="skills">CLAUDE<br>
        <input type="checkbox" id="skills" name="skills">AI<br>
        <label for="city">City</label>
        <select>
            <option>Chennai</option>
            <option>Tirunelveli</option>
            <option>Bangalore</option>
        </select><br>
        <label for="dob">Date Of Birth</label>
        <input type="date" id="dob" name="dob"><br>
        <label for="resume">Resume</label>
        <input type="file" id="resume" name="resume" placeholder="Upload your current resume"><br>
        <fieldset>
            <legend>address</legend>
            <textarea rows="5" cols="20" required></textarea>
        </fieldset><br>
        </span></form>
        <footer>&copy; ALL RIGHTS RESERVED TO THE OWNER </footer>
        <HR>
</body>
</html>
