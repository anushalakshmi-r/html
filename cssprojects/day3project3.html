<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
             padding:0;
            box-sizing:border-box;
}

body{

background:#f2f2f2;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
width:320px;
background:white;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
text-align:center;
transition:.3s;
}
.card:hover{
box-shadow:20px 20px 50px rgba(0,0,0,.3);
}
.card img{
width:100%;
display:block;
}
.card h2{
margin:15px;
font-size:3vmax;
}
.card p{
padding:0 20px;
font-size:2vmin;
color:#555;
line-height:1.6;
}

.card h3{
margin:20px;
color:#0077cc;
}

button{
    margin-bottom:20px;
padding:12px 25px;
background:#0077cc;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
    background:#02375c;
}
    </style>
</head>
<body>
    <div class="card">

    <img src="download (1).jpg" alt="Product">

    <h2>Wireless Headphones</h2>
     <p>
        Premium quality headphones with noise cancellation and long battery life.
    </p>

    <h3>₹2,999</h3>

    <button>Buy Now</button>

</div>
</body>
</html>
