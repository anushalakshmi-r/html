<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Job Application</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">
                Job Portal
            </a>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#jobModal"
            >
                Apply Now
            </button>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container text-center mt-5">

        <h1>Join Our Team</h1>

        <p class="text-muted">
            Apply for exciting career opportunities and grow with us.
        </p>

        <button
            class="btn btn-primary btn-lg"
            data-bs-toggle="modal"
            data-bs-target="#jobModal"
        >
            Apply Now
        </button>

    </div>


    <!-- Job Application Modal -->
    <div
        class="modal fade"
        id="jobModal"
        tabindex="-1"
        aria-labelledby="jobModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="jobModalLabel"
                    >
                        Job Application Form
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form>

                        <!-- Bootstrap Grid -->
                        <div class="row">

                            <!-- Full Name -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                >

                            </div>


                            <!-- Email -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                >

                            </div>

                        </div>


                        <!-- Second Row -->
                        <div class="row">

                            <!-- Phone Number -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter phone number"
                                >

                            </div>


                            <!-- Qualification -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Qualification
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Select Qualification
                                    </option>

                                    <option>
                                        High School
                                    </option>

                                    <option>
                                        Diploma
                                    </option>

                                    <option>
                                        Bachelor's Degree
                                    </option>

                                    <option>
                                        Master's Degree
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- Third Row -->
                        <div class="row">

                            <!-- Experience -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Experience
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Select Experience
                                    </option>

                                    <option>
                                        Fresher
                                    </option>

                                    <option>
                                        1 - 2 Years
                                    </option>

                                    <option>
                                        3 - 5 Years
                                    </option>

                                    <option>
                                        More than 5 Years
                                    </option>

                                </select>

                            </div>


                            <!-- Skills -->
                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Skills
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Example: HTML, CSS, Python"
                                >

                            </div>

                        </div>


                        <!-- Resume Upload -->
                        <div class="mb-3">

                            <label class="form-label">
                                Upload Resume
                            </label>

                            <input
                                type="file"
                                class="form-control"
                            >

                        </div>


                        <!-- Cover Letter -->
                        <div class="mb-3">

                            <label class="form-label">
                                Cover Letter
                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                placeholder="Write your cover letter here"
                            ></textarea>

                        </div>

                    </form>

                </div>


                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Submit Application
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
