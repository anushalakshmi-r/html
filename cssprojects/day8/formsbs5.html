<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Feedback</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand" href="#">
                Feedback Portal
            </a>

            <!-- Give Feedback Button -->
            <button
                class="btn btn-light"
                data-bs-toggle="modal"
                data-bs-target="#feedbackModal"
            >
                Give Feedback
            </button>

        </div>

    </nav>


    <!-- Main Content -->
    <div class="container text-center my-5">

        <h1>We Value Your Feedback</h1>

        <p class="text-muted">
            Share your experience and help us improve our services.
        </p>

        <!-- Success Alert -->
        <div
            id="successAlert"
            class="alert alert-success alert-dismissible fade show d-none"
            role="alert"
        >

            <strong>Thank you!</strong>
            Thank you for your valuable feedback!

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
            ></button>

        </div>


        <!-- Give Feedback Button -->
        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#feedbackModal"
        >
            Give Feedback
        </button>

    </div>


    <!-- Feedback Modal -->
    <div
        class="modal fade"
        id="feedbackModal"
        tabindex="-1"
        aria-labelledby="feedbackModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="feedbackModalLabel"
                    >
                        Customer Feedback Form
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="feedbackForm">

                        <!-- Customer Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Customer Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- Rating -->
                        <div class="mb-3">

                            <label class="form-label d-block">
                                Rating
                            </label>


                            <!-- Rating 1 -->
                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating1"
                                    value="1"
                                    required
                                >

                                <label
                                    class="form-check-label"
                                    for="rating1"
                                >
                                    1
                                </label>

                            </div>


                            <!-- Rating 2 -->
                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating2"
                                    value="2"
                                >

                                <label
                                    class="form-check-label"
                                    for="rating2"
                                >
                                    2
                                </label>

                            </div>


                            <!-- Rating 3 -->
                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating3"
                                    value="3"
                                >

                                <label
                                    class="form-check-label"
                                    for="rating3"
                                >
                                    3
                                </label>

                            </div>


                            <!-- Rating 4 -->
                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating4"
                                    value="4"
                                >

                                <label
                                    class="form-check-label"
                                    for="rating4"
                                >
                                    4
                                </label>

                            </div>


                            <!-- Rating 5 -->
                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="rating"
                                    id="rating5"
                                    value="5"
                                >

                                <label
                                    class="form-check-label"
                                    for="rating5"
                                >
                                    5
                                </label>

                            </div>

                        </div>


                        <!-- Service Type -->
                        <div class="mb-3">

                            <label class="form-label">
                                Service Type
                            </label>

                            <select class="form-select" required>

                                <option value="">
                                    Select Service
                                </option>

                                <option>
                                    Customer Support
                                </option>

                                <option>
                                    Product Service
                                </option>

                                <option>
                                    Delivery Service
                                </option>

                                <option>
                                    Technical Support
                                </option>

                            </select>

                        </div>


                        <!-- Feedback -->
                        <div class="mb-3">

                            <label class="form-label">
                                Feedback
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                placeholder="Write your feedback here"
                                required
                            ></textarea>

                        </div>


                        <!-- Agree to Terms -->
                        <div class="form-check mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <label
                                class="form-check-label"
                                for="terms"
                            >
                                I agree to the Terms and Conditions
                            </label>

                        </div>


                        <!-- Modal Footer -->
                        <div class="modal-footer">

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Close
                            </button>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Submit Feedback
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JavaScript for Form Submission -->
    <script>

        const feedbackForm =
            document.getElementById("feedbackForm");

        feedbackForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                // Close Modal
                const feedbackModal =
                    bootstrap.Modal.getInstance(
                        document.getElementById("feedbackModal")
                    );

                feedbackModal.hide();


                // Show Success Alert
                document
                    .getElementById("successAlert")
                    .classList.remove("d-none");


                // Reset Form
                feedbackForm.reset();

            }
        );

    </script>

</body>

</html>
