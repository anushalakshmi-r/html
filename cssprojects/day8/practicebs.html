<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="text-center">Food Menu</div>
        <div class="row mb-3">
            <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=800&q=80" class="card-img-top" alt="Grilled Burger">
                <div class="card-body">
                    <div class="card-title">Grilled burder</div>
                    <div class="text-muted mt-2">Juicy burgers</div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="card-text"><strong>rs.299</strong></span>
                    <button class="btn btn-success">Order now</button>
                </div>
                </div>
            </div>    
            <div class="col-lg-4 col-md-6 col-sm-12">
                <div class="card menu-card">
                <img src="student.jpg" class="card-img-top rounded-pill" alt="pizza">
                <div class="card-body">
                    <div class="card-title">Pizza</div>
                    <p class="card-text text-muted mt-3">Delicious pizza</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span>Rs.399</span>
                        <button class="btn btn-primary">Order now</button>
                    </div></div>
                </div>
            </div>
            </div>
            <div class="col-lg-4 col-md-6 col-sm-12">
                <img src="student.jpg" class="card-img-top" alt="samosaa">
                <div class="card-body">
                <h3 class="card-title my-4">Samosa</h3>
                <p class="card-text text-muted mt-3">Potato samosa</p>
                <div class="d-flex justify-content-between align-items-center">
                    <span>Rs.29</span>
                    <button class="btn btn-danger">Order now</button>
                </div>
            </div>
            </div>
    </div>

</body>
</html>
