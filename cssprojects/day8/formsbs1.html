<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="#">
                Student Portal
            </a>

            <!-- Register Button -->
            <button
                class="btn btn-light"
                data-bs-toggle="modal"
                data-bs-target="#registerModal"
            >
                Register
            </button>

        </div>
    </nav>


    <!-- Main Content -->
    <div class="container text-center mt-5">

        <h1>Student Registration</h1>

        <p class="text-muted">
            Click the Register button to create your student account.
        </p>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#registerModal"
        >
            Register Now
        </button>

    </div>


    <!-- Registration Modal -->
    <div
        class="modal fade"
        id="registerModal"
        tabindex="-1"
        aria-labelledby="registerModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="registerModalLabel"
                    >
                        Student Registration Form
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form>

                        <!-- Student Name -->
                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter your name"
                            >

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                placeholder="Enter your email"
                            >

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Enter password"
                            >

                        </div>


                        <!-- Phone Number -->
                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="Enter phone number"
                            >

                        </div>


                        <!-- Gender -->
                        <div class="mb-3">

                            <label class="form-label d-block">
                                Gender
                            </label>

                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                >

                                <label
                                    class="form-check-label"
                                    for="male"
                                >
                                    Male
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                >

                                <label
                                    class="form-check-label"
                                    for="female"
                                >
                                    Female
                                </label>

                            </div>

                        </div>


                        <!-- Course Dropdown -->
                        <div class="mb-3">

                            <label class="form-label">
                                Course
                            </label>

                            <select class="form-select">

                                <option selected>
                                    Select Course
                                </option>

                                <option>
                                    Full Stack Development
                                </option>

                                <option>
                                    Data Science
                                </option>

                                <option>
                                    Artificial Intelligence
                                </option>

                                <option>
                                    Cloud Computing
                                </option>

                            </select>

                        </div>


                        <!-- Skills -->
                        <div class="mb-3">

                            <label class="form-label d-block">
                                Skills
                            </label>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="html"
                                >

                                <label
                                    class="form-check-label"
                                    for="html"
                                >
                                    HTML
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="css"
                                >

                                <label
                                    class="form-check-label"
                                    for="css"
                                >
                                    CSS
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="javascript"
                                >

                                <label
                                    class="form-check-label"
                                    for="javascript"
                                >
                                    JavaScript
                                </label>

                            </div>


                            <div class="form-check form-check-inline">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="python"
                                >

                                <label
                                    class="form-check-label"
                                    for="python"
                                >
                                    Python
                                </label>

                            </div>

                        </div>


                        <!-- Address -->
                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                rows="3"
                                placeholder="Enter your address"
                            ></textarea>

                        </div>


                        <!-- Modal Footer -->
                        <div class="modal-footer">

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Close
                            </button>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Register
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
